# Гейт на тесты: job `tests` — обязательная проверка для мержа в main
# (правило защиты ветки ссылается на это имя — не переименовывать).
#
# Раннер без GPU и без весов моделей, поэтому исключены маркеры, которым они
# нужны: models (веса), reference (эталонная запись), gpu (CUDA). Тяжёлые
# библиотеки моделей не ставятся: тесты подменяют их фейками или пропускают
# по check_availability(). Полный набор гоняется в Docker-образе на целевой
# машине (docker/README.md).

name: tests

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml

      # ffmpeg/ffprobe нужны тестам media-ingest и CLI: синтетические ролики
      # кодируются и разбираются настоящим ffmpeg.
      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg

      - name: Install package
        run: pip install -e ".[dev]"

      - name: Run tests
        run: python -m pytest -m "not models and not reference and not gpu" -ra
